[servers]
myserver ansible_host=CHANGE_ME

[servers:vars]
# Параметры самого первого подключения к чистому серверу.
initial_user=root
# key или password
initial_auth_method=password
initial_ssh_port=22
# Варианты: accept-new, yes, no. accept-new автоматически добавит новый host key в known_hosts.
ssh_host_key_checking_mode=no
initial_ssh_private_key_file=~/.ssh/id_ed25519
initial_ssh_password=CHANGE_ME_IF_USING_PASSWORD

# Параметры нового администратора после инициализации.
new_user=admin
new_ssh_port=23153
# Этим ключом Ansible зайдет во втором playbook уже под new_user.
new_user_ssh_private_key_file=~/.ssh/id_ed25519
new_user_public_key_path=~/.ssh/id_ed25519.pub
new_user_sudo_without_password=true

# Настройки fail2ban для SSH.
# -1 означает бан навсегда.
fail2ban_bantime=-1
fail2ban_findtime=1d
fail2ban_maxretry=2
# Куда fail2ban пишет собственный лог и с какой детализацией.
fail2ban_logtarget=/var/log/fail2ban.log
fail2ban_loglevel=INFO
