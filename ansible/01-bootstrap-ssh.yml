---
- name: Первичная настройка SSH и базовый hardening сервера
  hosts: servers
  remote_user: "{{ initial_user }}"
  become: true
  vars:
    ansible_port: "{{ initial_ssh_port }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking={{ ssh_host_key_checking_mode | default('accept-new') }}"
    ansible_ssh_private_key_file: >-
      {{
        initial_ssh_private_key_file
        if initial_auth_method == 'key'
        else omit
      }}
    ansible_password: >-
      {{
        initial_ssh_password
        if initial_auth_method == 'password'
        else omit
      }}

  pre_tasks:
    - name: Проверить параметры первого входа
      ansible.builtin.assert:
        that:
          - initial_auth_method in ['key', 'password']
          - (ssh_host_key_checking_mode | default('accept-new')) in ['accept-new', 'yes', 'no']
          - initial_auth_method != 'key' or (initial_ssh_private_key_file is defined and initial_ssh_private_key_file | length > 0)
          - initial_auth_method != 'password' or (initial_ssh_password is defined and initial_ssh_password != 'CHANGE_ME_IF_USING_PASSWORD' and initial_ssh_password | length > 0)
        fail_msg: "Заполните корректные initial_* переменные в inventory.ini."

  handlers:
    - name: Проверить конфиг sshd
      ansible.builtin.command: sshd -t
      listen: Безопасно перезапустить SSH

    - name: Перезапустить сервис SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
      listen: Безопасно перезапустить SSH

    - name: Перезапустить сервис fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
      listen: Перезапустить fail2ban

  tasks:
    - name: Обновить apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Установить необходимые пакеты
      ansible.builtin.apt:
        name:
          - sudo
          - openssh-server
          - fail2ban
        state: present

    - name: Создать нового пользователя
      ansible.builtin.user:
        name: "{{ new_user }}"
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true
        state: present

    - name: Добавить публичный ключ новому пользователю
      ansible.posix.authorized_key:
        user: "{{ new_user }}"
        state: present
        key: "{{ lookup('file', new_user_public_key_path) }}"

    - name: Настроить sudo для нового пользователя
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ new_user }}"
        owner: root
        group: root
        mode: "0440"
        content: |
          {% if new_user_sudo_without_password | bool %}
          {{ new_user }} ALL=(ALL) NOPASSWD:ALL
          {% else %}
          {{ new_user }} ALL=(ALL:ALL) ALL
          {% endif %}
        validate: "visudo -cf %s"

    - name: Изменить SSH-порт
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*Port\s+'
        line: "Port {{ new_ssh_port }}"
        state: present
        validate: "sshd -t -f %s"
      notify: Безопасно перезапустить SSH

    - name: Записать настройки hardening для SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          PubkeyAuthentication yes
          PermitEmptyPasswords no

          X11Forwarding no
          AllowAgentForwarding no
          AllowTcpForwarding no

          MaxAuthTries 3
          LoginGraceTime 30
          ClientAliveInterval 300
          ClientAliveCountMax 2

          AllowUsers {{ new_user }}
      notify: Безопасно перезапустить SSH

    - name: Настроить fail2ban jail для sshd
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          port = {{ new_ssh_port }}
          filter = sshd
          backend = systemd
          maxretry = {{ fail2ban_maxretry }}
          findtime = {{ fail2ban_findtime }}
          bantime = {{ fail2ban_bantime }}
      notify: Перезапустить fail2ban

    - name: Настроить логирование fail2ban
      ansible.builtin.copy:
        dest: /etc/fail2ban/fail2ban.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [Definition]
          logtarget = {{ fail2ban_logtarget }}
          loglevel = {{ fail2ban_loglevel }}
      notify: Перезапустить fail2ban

    - name: Включить и запустить fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    - name: Применить отложенные изменения сервисов
      ansible.builtin.meta: flush_handlers

    - name: Дождаться доступности нового SSH-порта
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ new_ssh_port }}"
        timeout: 60
        delay: 1
        state: started
      delegate_to: localhost
      become: false
